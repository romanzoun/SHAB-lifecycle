[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["shab_analyzer*"]

[project]
name = "shab-analyzer"
version = "0.1.0"
description = "Deterministic SHAB XML/text parser and Postgres lens warehouse"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
shab-parser = "shab_analyzer.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
